<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f5f0" />
  <title>Randomizer</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main>
    <div class="toolbar" aria-label="Randomizer controls">
      <button id="new" type="button"><span aria-hidden="true">⊕</span> New</button>
      <select id="collections" aria-label="Saved collections"><option value="">Select a folder…</option></select>
      <button id="edit" type="button" hidden>Edit</button>
      <button id="play" class="primary" type="button" aria-describedby="validation" disabled><span aria-hidden="true">▶</span> <span id="play-label">Run</span></button>
      <button id="reset-draw" class="text-button" type="button" disabled>Reset</button>
    </div>
    <div class="draw-status">
      <p id="draw-progress" class="draw-progress" role="status" hidden></p>
      <p id="validation" class="validation" role="status" hidden></p>
    </div>
    <p id="storage-note" class="notice" role="status" hidden></p>
    <p id="error" class="notice" role="alert" hidden></p>
    <section id="results" class="results" aria-label="Draw results" tabindex="-1" hidden></section>
    <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <dialog id="configuration" aria-labelledby="modal-title">
    <div class="modal-heading"><h1 id="modal-title">New collection</h1><button id="close-modal" class="close-button" aria-label="Close configuration" type="button">×</button></div>
    <p id="modal-error" class="notice" role="alert" hidden></p>
    <fieldset id="configuration-controls">
      <legend class="sr-only">Collection settings</legend>
      <div class="folder-row"><span>Folder: <strong id="dataset-name">None selected</strong></span><button id="open-folder" type="button">Select folder</button></div>
      <input id="folder-input" type="file" webkitdirectory multiple hidden />
      <input id="search" type="search" aria-label="Search entries" placeholder="Find an entry" />
      <div class="selection-bar"><span id="selection-count">0 selected</span><div><button id="select-all" class="text-button" type="button">Select all</button><span aria-hidden="true"> / </span><button id="clear-selection" class="text-button" type="button">Clear selection</button></div></div>
      <div id="entries" class="entry-list"></div>
      <fieldset class="mode-options"><legend>Mode</legend>
        <label><input type="radio" name="mode" value="shuffle" checked /> Shuffle <span>(Shuffles through selected items)</span></label>
        <label><input type="radio" name="mode" value="pick" /> Pick <span>(Pick from selected items)</span></label>
      </fieldset>
      <label id="count-label" class="count-label" for="result-count" hidden>Results: <input id="result-count" type="number" min="1" step="1" value="1" /></label>
      <p id="save-validation" class="validation" role="status"></p>
      <div class="modal-actions"><button id="save" class="primary" type="button" disabled>Save</button><button id="cancel" type="button">Cancel</button></div>
    </fieldset>
  </dialog>
</body>
</html>
